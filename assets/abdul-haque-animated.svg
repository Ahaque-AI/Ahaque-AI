<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 980 280" role="img" aria-label="Abdul Haque animated profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071225"/>
      <stop offset="1" stop-color="#061b2f"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#4fd1ff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#7c5cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .frame { background: none; }
      .name { transition: transform 250ms ease, filter 250ms ease; transform-origin: 40px 140px; }
      svg:hover .name { transform: translateY(-3px) scale(1.01); filter: drop-shadow(0 0 20px rgba(79,209,255,0.35)); }

      .particle { opacity: 0.65; filter: url(#softGlow); }
      svg:hover .particle { animation-duration: 2.9s !important; opacity: 0.85; }

      @keyframes drift1 { from { transform: translate(0px, 0px); } to { transform: translate(42px, -18px); } }
      @keyframes drift2 { from { transform: translate(0px, 0px); } to { transform: translate(-36px, 26px); } }
      @keyframes drift3 { from { transform: translate(0px, 0px); } to { transform: translate(26px, 34px); } }

      .p1 { animation: drift1 4.8s ease-in-out infinite alternate; animation-delay: 0s; }
      .p2 { animation: drift2 5.3s ease-in-out infinite alternate; animation-delay: -1.2s; }
      .p3 { animation: drift3 4.2s ease-in-out infinite alternate; animation-delay: -2.4s; }
      .p4 { animation: drift2 6.1s ease-in-out infinite alternate; animation-delay: -3.1s; }
      .p5 { animation: drift1 5.0s ease-in-out infinite alternate; animation-delay: -1.8s; }
      .p6 { animation: drift3 5.6s ease-in-out infinite alternate; animation-delay: -0.6s; }

      @keyframes underline { 0% { stroke-dashoffset: 520; opacity: 0.6; } 55% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
      .u { stroke-dasharray: 520; stroke-dashoffset: 520; animation: underline 2.2s ease-out infinite; }

      .phrase { opacity: 0; transform: translateY(8px) scale(0.98); }
      .phrase { animation: phraseCycle 9s ease-in-out infinite; }
      .ph1 { animation-delay: 0s; }
      .ph2 { animation-delay: 3s; }
      .ph3 { animation-delay: 6s; }
      @keyframes phraseCycle {
        0%, 18% { opacity: 0; transform: translateY(8px) scale(0.98); }
        26%, 52% { opacity: 1; transform: translateY(0px) scale(1); }
        60%, 100% { opacity: 0; transform: translateY(-6px) scale(0.99); }
      }

      .cursor { animation: blink 1.05s steps(2, end) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .chip { transition: transform 200ms ease, opacity 200ms ease; }
      svg:hover .chip { transform: translateY(-1px); opacity: 1; }
    </style>
  </defs>

  <rect width="980" height="280" fill="url(#bg)"/>
  <circle cx="500" cy="110" r="220" fill="url(#glow)"/>

  <!-- particles -->
  <g class="particle p1" transform="translate(120 65)">
    <circle cx="0" cy="0" r="10" fill="#4fd1ff"/>
  </g>
  <g class="particle p2" transform="translate(840 70)">
    <circle cx="0" cy="0" r="12" fill="#7c5cff"/>
  </g>
  <g class="particle p3" transform="translate(760 185)">
    <circle cx="0" cy="0" r="9" fill="#22c55e"/>
  </g>
  <g class="particle p4" transform="translate(170 210)">
    <circle cx="0" cy="0" r="8" fill="#4fd1ff"/>
  </g>
  <g class="particle p5" transform="translate(420 55)">
    <circle cx="0" cy="0" r="6" fill="#7c5cff"/>
  </g>
  <g class="particle p6" transform="translate(560 235)">
    <circle cx="0" cy="0" r="7" fill="#22c55e"/>
  </g>

  <!-- main -->
  <g class="name" filter="url(#softGlow)" transform="translate(40 0)">
    <text x="0" y="120" font-family="'IBM Plex Sans', 'IBM Plex Mono', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="72" font-weight="750" fill="url(#gradText)">Abdul Haque</text>
    <text x="6" y="120" font-family="'IBM Plex Sans', ui-sans-serif, system-ui" font-size="72" font-weight="750" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

    <!-- animated underline -->
    <path class="u" d="M0 150 C180 130, 300 190, 520 160" fill="none" stroke="#4fd1ff" stroke-width="3"/>

    <g transform="translate(0 0)">
      <text x="0" y="190" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="18" fill="#cfe8ff" opacity="0.95">Build -> Deploy -> Iterate</text>

      <g transform="translate(0 26)">
        <text class="phrase ph1" x="0" y="0" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas" font-size="22" font-weight="650" fill="#e9f6ff">AI Software Engineer</text>
        <text class="phrase ph2" x="0" y="0" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas" font-size="22" font-weight="650" fill="#e9f6ff">Backend Systems</text>
        <text class="phrase ph3" x="0" y="0" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas" font-size="22" font-weight="650" fill="#e9f6ff">LLMs & Agentic AI</text>
      </g>

      <g transform="translate(0 56)" class="chip">
        <rect x="0" y="0" width="360" height="38" rx="12" fill="#0b2a45" fill-opacity="0.85" stroke="#2dd4ff" stroke-opacity="0.35"/>
        <text x="16" y="25" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas" font-size="15" fill="#bfeaff">prod-ready microservices</text>
        <text x="302" y="25" font-family="'IBM Plex Mono', ui-monospace" font-size="15" fill="#bfeaff" opacity="0.95">&#x2192;</text>
      </g>

      <g transform="translate(390 56)" class="chip" opacity="0.92">
        <rect x="0" y="0" width="290" height="38" rx="12" fill="#0b2a45" fill-opacity="0.70" stroke="#a78bfa" stroke-opacity="0.30"/>
        <text x="16" y="25" font-family="'IBM Plex Mono', ui-monospace" font-size="15" fill="#e9d5ff">Azure • Kafka • RAG</text>
        <text x="214" y="25" font-family="'IBM Plex Mono', ui-monospace" font-size="15" fill="#e9d5ff" opacity="0.95">•</text>
        <text x="228" y="25" font-family="'IBM Plex Mono', ui-monospace" font-size="15" fill="#e9d5ff" opacity="0.95">OpenAI/Anthropic</text>
      </g>
    </g>

    <!-- terminal hint -->
    <g transform="translate(0 226)" opacity="0.9">
      <text x="0" y="0" font-family="'IBM Plex Mono', ui-monospace" font-size="14" fill="#bcdcff">npm run impress</text>
      <text x="158" y="0" class="cursor" font-family="'IBM Plex Mono', ui-monospace" font-size="14" fill="#bcdcff">|</text>
    </g>
  </g>

  <!-- hover helper line -->
  <g opacity="0.35">
    <path d="M60 175 L920 175" stroke="#4fd1ff" stroke-width="1" stroke-dasharray="8 10"/>
  </g>
</svg>
